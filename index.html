<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Astro</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#0a0e1f;--ink:#e9ecff;--dim:#8d94c4;--star:#ffcf6e;--line:#232a52;--panel:#121835}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:radial-gradient(120% 80% at 50% 25%,#16205a,var(--bg) 60%);color:var(--ink);font:16px/1.45 "Avenir Next",Avenir,"Trebuchet MS",sans-serif;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px}
h1{font-size:22px;letter-spacing:.14em;margin:0}
button{font:inherit;color:inherit;background:none;border:1px solid var(--line);border-radius:999px;padding:8px 14px}
button.on{background:var(--star);color:#1a1300;border-color:var(--star)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--star);outline-offset:2px}
#stage{display:flex;justify-content:center}canvas{width:min(58vw,240px);aspect-ratio:1}
#status{text-align:center;color:var(--dim);min-height:1.5em;font-size:14px;padding:0 14px}
#bar{display:flex;gap:8px;justify-content:center;padding:8px}
#log{flex:1;overflow-y:auto;padding:8px 18px;display:flex;flex-direction:column;gap:10px}
.m{max-width:86%;padding:10px 14px;border-radius:16px;white-space:pre-wrap;overflow-wrap:anywhere}
.u{align-self:flex-end;background:var(--panel);border:1px solid var(--line)}
.a{align-self:flex-start;border-left:2px solid var(--star);border-radius:4px 16px 16px 4px;padding-left:12px}
.err{color:#ff9b9b;font-size:14px;align-self:center;text-align:center}
form{display:flex;gap:8px;padding:8px 14px 14px}
input,textarea{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 13px;width:100%}
form input{flex:1}#send{background:var(--star);color:#1a1300;border-color:var(--star);font-weight:600}
dialog{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:18px;width:min(92vw,420px);padding:20px}
dialog::backdrop{background:#000a}dialog label{display:block;margin:12px 0 4px;color:var(--dim);font-size:14px}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}small{color:var(--dim)}
</style></head><body>
<header><h1>Astro</h1><button id="gear">Settings</button></header>
<div id="stage"><canvas id="orb" width="480" height="480"></canvas></div>
<div id="status">Tap the star and speak</div>
<div id="bar"><button id="hf">Hands-free</button><button id="cam">Look</button><button id="web" class="on">Web search</button></div>
<div id="log" aria-live="polite"></div>
<form id="f"><input id="t" placeholder="Or type a message" autocomplete="off"><button id="send">Send</button></form>
<dialog id="dlg"><h2 style="margin:0 0 4px;font-size:18px">Settings</h2>
<small>Stored on this phone only. Key from aistudio.google.com.</small>
<label for="key">Gemini API key</label><input id="key" type="password" autocomplete="off">
<label for="model">Model</label><input id="model" placeholder="gemini-2.5-flash">
<label for="sys">Personality</label><textarea id="sys" rows="3"></textarea>
<div class="row"><button id="clear" type="button">Clear chat</button><button id="save" type="button">Save</button></div></dialog>
<script>
const $=id=>document.getElementById(id),sleep=ms=>new Promise(r=>setTimeout(r,ms));
const P=(window.Capacitor&&Capacitor.Plugins)||{},SR=P.SpeechRecognition,TTS=P.TextToSpeech,CAM=P.Camera,AL=P.AppLauncher;
const S={get(k,d){try{return localStorage.getItem(k)??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const DEF="You are Astro, a calm, quick-witted voice assistant on the user's phone. Answer in one to three short spoken sentences, no markdown. When the user clearly asks you to act, add tags at the end: [[tel:NUMBER]] to call, [[sms:NUMBER|MESSAGE]] to text, [[open:URL]] to open a link or app, [[alarm:HH:MM]] (24h) to set an alarm. Only use a tag if you know the number or time.";
let history=[],state="idle",web=true,hf=false;
// orb
const cv=$("orb"),cx=cv.getContext("2d"),N=130,pts=[];
for(let i=0;i<N;i++){const a=Math.acos(1-2*(i+.5)/N),b=Math.PI*(1+Math.sqrt(5))*i;pts.push([Math.sin(a)*Math.cos(b),Math.sin(a)*Math.sin(b),Math.cos(a)])}
let amp=0;
(function draw(t){const W=480,c=W/2,tt=t/1000,tg={idle:.04,listening:.14,thinking:.07,speaking:.18}[state];amp+=(tg-amp)*.08;
const sp={idle:.25,listening:.5,thinking:2.2,speaking:.7}[state],pu=state==="speaking"?Math.sin(tt*9)*.5+Math.sin(tt*5.3)*.5:Math.sin(tt*1.6),R=W*.3*(1+amp*pu);
cx.clearRect(0,0,W,W);const g=cx.createRadialGradient(c,c,0,c,c,R*1.5);g.addColorStop(0,"rgba(255,207,110,.28)");g.addColorStop(1,"rgba(255,207,110,0)");cx.fillStyle=g;cx.fillRect(0,0,W,W);
const ca=Math.cos(tt*sp),sa=Math.sin(tt*sp),ct=Math.cos(.5),st=Math.sin(.5);
for(const p of pts){const x=p[0]*ca-p[2]*sa,z=p[0]*sa+p[2]*ca,y2=p[1]*ct-z*st,z2=p[1]*st+z*ct,k=(z2+1.4)/2.4;
cx.fillStyle=`rgba(${state==="listening"?"150,200,255":"255,207,110"},${.25+.75*k})`;cx.beginPath();cx.arc(c+x*R,c+y2*R,1.1+2.4*k,0,6.283);cx.fill()}
requestAnimationFrame(draw)})(0);
// ui
const LBL={idle:"Tap the star and speak",listening:"Listening…",thinking:"Thinking…",speaking:"Speaking… tap to interrupt"};
function setState(s,t){state=s;$("status").textContent=t||LBL[s]}
function add(c,t){const d=document.createElement("div");d.className="m "+c;d.textContent=t;$("log").appendChild(d);$("log").scrollTop=1e9}
function err(t){const d=document.createElement("div");d.className="err";d.textContent=t;$("log").appendChild(d);$("log").scrollTop=1e9;setState("idle")}
// voice
async function say(text){
  if(!text)return setState("idle");setState("speaking");
  try{if(TTS)await TTS.speak({text,lang:"en-US",rate:1,pitch:1,volume:1});else if(window.speechSynthesis){await new Promise(r=>{const u=new SpeechSynthesisUtterance(text);u.onend=u.onerror=r;speechSynthesis.speak(u)})}}catch(e){}
  setState("idle")}
async function stopSpeech(){try{if(TTS)await TTS.stop();else speechSynthesis.cancel()}catch(e){}setState("idle")}
async function listenOnce(maxMs=9000){
  if(!SR)throw new Error("Speech plugin missing. Use the installed app, not a browser.");
  const p=await SR.requestPermissions();if(p.speechRecognition!=="granted")throw new Error("Microphone permission denied.");
  return new Promise(async res=>{let last="",lastAt=Date.now(),t0=Date.now(),done=false,iv;
    const h=await SR.addListener("partialResults",d=>{const m=d.matches&&d.matches[0];if(m&&m!==last){last=m;lastAt=Date.now();$("status").textContent=m}});
    const fin=async()=>{if(done)return;done=true;clearInterval(iv);try{await SR.stop()}catch(e){}h.remove();res(last)};
    iv=setInterval(()=>{const n=Date.now();if((last&&n-lastAt>1400)||n-t0>maxMs)fin()},300);
    SR.start({language:"en-US",partialResults:true,popup:false}).catch(fin)})}
async function talk(){setState("listening");let q="";try{q=await listenOnce()}catch(e){return err(e.message)}
  if(q.trim())await ask(q.trim());else setState("idle")}
// actions
async function run(a,v){
  let url="",ask_="";
  if(a==="tel"){url="tel:"+v.replace(/[^\d+]/g,"");ask_="Call "+v+"?"}
  else if(a==="sms"){const[n,m]=v.split("|");url="sms:"+n.replace(/[^\d+]/g,"")+"?body="+encodeURIComponent(m||"");ask_="Open a text to "+n+"?"}
  else if(a==="open"){url=v;ask_="Open "+v+"?"}
  else if(a==="alarm"){const[h,m]=v.split(":").map(Number);url=`intent:#Intent;action=android.intent.action.SET_ALARM;i.android.intent.extra.alarm.HOUR=${h};i.android.intent.extra.alarm.MINUTES=${m||0};end`;ask_="Set an alarm for "+v+"?"}
  if(!url||!confirm(ask_))return;
  try{await AL.openUrl({url})}catch(e){err("Couldn't do that: "+(e.message||e))}}
// brain
async function ask(text,img){
  const key=S.get("key","");if(!key){err("Add your Gemini API key in Settings first.");$("dlg").showModal();return}
  add("u",(img?"📷 ":"")+text);setState("thinking");
  const parts=[{text}];if(img)parts.push({inlineData:{mimeType:"image/jpeg",data:img}});
  const contents=[...history.slice(-20),{role:"user",parts}];
  const body={systemInstruction:{parts:[{text:S.get("sys","")||DEF}]},contents};if(web)body.tools=[{google_search:{}}];
  try{const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(S.get("model","")||"gemini-2.5-flash")}:generateContent`,{method:"POST",headers:{"Content-Type":"application/json","x-goog-api-key":key},body:JSON.stringify(body)});
    const j=await r.json();if(!r.ok)throw new Error(j.error?.message||"HTTP "+r.status);
    let out=(j.candidates?.[0]?.content?.parts||[]).map(p=>p.text||"").join("").trim();if(!out)throw new Error("Gemini returned no text.");
    const acts=[...out.matchAll(/\[\[(tel|sms|open|alarm):([^\]]*)\]\]/g)];out=out.replace(/\[\[[^\]]*\]\]/g,"").replace(/[*_`#]/g,"").trim();
    history.push({role:"user",parts:[{text:(img?"[photo] ":"")+text}]},{role:"model",parts:[{text:out}]});
    add("a",out);const sp=say(out);for(const m of acts)await run(m[1],m[2].trim());await sp;
  }catch(e){err("Gemini error: "+e.message)}}
// look
async function look(){
  if(!CAM)return err("Camera works in the installed app only.");
  try{const ph=await CAM.getPhoto({resultType:"base64",quality:60,width:1024,source:"CAMERA"});
    setState("listening","What should I look for?");let q="";try{q=await listenOnce(6000)}catch(e){}
    await ask(q.trim()||"Describe what you see.",ph.base64String)}catch(e){err("Camera: "+(e.message||"cancelled"))}}
// hands-free: say "Astro ..." while the app is open
async function loopHF(){
  while(hf){if(state!=="idle"){await sleep(400);continue}
    let t="";try{t=await listenOnce(7000)}catch(e){hf=false;$("hf").classList.remove("on");return err(e.message)}
    if(!hf)break;const m=t.toLowerCase().match(/\bastro\b[\s,.!?]*(.*)/);
    if(m){const q=m[1].trim();if(q)await ask(q);else{await say("Yes?");let q2="";try{q2=await listenOnce()}catch(e){}if(q2.trim())await ask(q2.trim())}}
    await sleep(250)}}
// wiring
cv.onclick=()=>{if(state==="speaking")stopSpeech();else if(state==="idle"&&!hf)talk()};
$("f").onsubmit=e=>{e.preventDefault();const v=$("t").value.trim();if(v){$("t").value="";ask(v)}};
$("cam").onclick=()=>{if(state==="idle")look()};
$("web").onclick=()=>{web=!web;$("web").classList.toggle("on",web)};
$("hf").onclick=()=>{hf=!hf;$("hf").classList.toggle("on",hf);if(hf){setState("idle","Say “Astro” then your question");loopHF()}else setState("idle")};
$("gear").onclick=()=>{$("key").value=S.get("key","");$("model").value=S.get("model","");$("sys").value=S.get("sys","")||DEF;$("dlg").showModal()};
$("save").onclick=()=>{S.set("key",$("key").value.trim());S.set("model",$("model").value.trim());S.set("sys",$("sys").value.trim());$("dlg").close()};
$("clear").onclick=()=>{history=[];$("log").textContent="";$("dlg").close()};
if(!S.get("key",""))add("a","Hi, I'm Astro. Open Settings and paste your Gemini API key, then tap the star.");
</script></body></html>
